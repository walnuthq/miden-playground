    <script>
      // Applies the theme before first paint, so a dark-mode viewer never sees
      // a flash of the light page. next-themes renders an equivalent script,
      // but it arrives via dangerouslySetInnerHTML and browsers do not execute
      // scripts inserted that way — in a client-rendered app it never runs.
      // Keep the storage key and values in step with the provider in
      // components/providers/index.tsx.
      (() => {
        try {
          const stored = localStorage.getItem("theme");
          const dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch {
          // Storage can throw when cookies are blocked; light is a fine default.
        }
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
