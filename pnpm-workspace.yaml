packages:
  - "apps/*"
  - "packages/*"

fetchTimeout: 1200000
fetchRetries: 10
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 300000

# 0.17.6 ships a security fix and is younger than pnpm's default minimum release
# age, so exempt exactly that version of the Miden packages.
minimumReleaseAgeExclude:
  - "@miden-sdk/miden-sdk@0.17.6"
  - "@miden-sdk/miden-wallet-adapter@0.17.6"
  - "@miden-sdk/miden-wallet-adapter-base@0.17.6"
  - "@miden-sdk/miden-wallet-adapter-miden@0.17.6"
  - "@miden-sdk/miden-wallet-adapter-react@0.17.6"
  - "@miden-sdk/miden-wallet-adapter-reactui@0.17.6"
  - "@miden-sdk/para@0.17.6"
  - "@miden-sdk/para-react@0.17.6"
  - "@miden-sdk/react@0.17.6"
  - "@miden-sdk/node-darwin-arm64@0.17.6"
  - "@miden-sdk/node-darwin-x64@0.17.6"
  - "@miden-sdk/node-linux-x64-gnu@0.17.6"
  - "@miden-sdk/node-linux-x64-musl@0.17.6"
  - "@biomejs/biome@2.6.2"
  - "@biomejs/cli-android-arm64@2.6.2"
  - "@biomejs/cli-android-x64@2.6.2"
  - "@biomejs/cli-darwin-arm64@2.6.2"
  - "@biomejs/cli-darwin-x64@2.6.2"
  - "@biomejs/cli-linux-arm64-musl@2.6.2"
  - "@biomejs/cli-linux-arm64@2.6.2"
  - "@biomejs/cli-linux-x64-musl@2.6.2"
  - "@biomejs/cli-linux-x64@2.6.2"
  - "@biomejs/cli-win32-arm64@2.6.2"
  - "@biomejs/cli-win32-x64@2.6.2"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  # Postinstall only runs a version check (pulled in by Para's wallet connectors).
  "@reown/appkit": false

# Point the SDK at the sibling web-sdk checkout instead of the registry. `link:`
# symlinks the package directories, so a rebuild there (`pnpm build` in web-sdk)
# is picked up without reinstalling here. Paths are relative to this workspace
# root.
# "@miden-sdk/miden-sdk": "link:../web-sdk/crates/web-client"
# "@miden-sdk/react": "link:../web-sdk/packages/react-sdk"
overrides:
  "@miden-sdk/miden-sdk": "0.17.6"
  "@miden-sdk/react": "0.17.6"

packageExtensions:
  # @next/mdx imports `next` types without declaring it, so it would pick up
  # whichever hoisted copy of next pnpm chose. Declaring the peer resolves it to
  # the importing app's own next.
  "@next/mdx":
    peerDependencies:
      next: "*"
