packages:
  - "apps/*"
  - "packages/*"

fetchTimeout: 1200000
fetchRetries: 10
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 300000

allowBuilds:
  esbuild: true
  workerd: true
  # Postinstall only runs a version check (pulled in by Para's wallet connectors).
  "@reown/appkit": false

# Point the SDK at the sibling web-sdk checkout instead of the registry. `link:`
# symlinks the package directories, so a rebuild there (`pnpm build` in web-sdk)
# is picked up without reinstalling here. Paths are relative to this workspace
# root.
# "@miden-sdk/miden-sdk": "link:../web-sdk/crates/web-client"
# "@miden-sdk/react": "link:../web-sdk/packages/react-sdk"
# @miden-sdk/vite-plugin is installed in apps/web only for the vite-wasm-setup
# skill it ships (not registered in vite.config.ts) and peers on Vite <= 6.
peerDependencyRules:
  allowedVersions:
    "@miden-sdk/vite-plugin>vite": "8"

overrides:
  "@miden-sdk/miden-sdk": "0.17.8"
  "@miden-sdk/react": "0.17.8"
  # Security fixes for transitive dependencies (Dependabot alerts). Remove each
  # once the packages that pull it in (Para, monaco-editor, the node polyfills)
  # ship the patched version.
  "node-forge": "^1.4.2"
  "dompurify": "^3.4.17"
  "follow-redirects": "^1.16.2"
  "qs": "^6.16.1"
  "bn.js@4": "^4.12.3"
  # GHSA-g3hv-75wg-m249. Keep these two together: glob 11 silently matches nothing
  # on minimatch 11. Remove both once the SDK and shadcn's ts-morph move on.
  "minimatch": "^11.0.4"
  "glob": "^14.0.3"
