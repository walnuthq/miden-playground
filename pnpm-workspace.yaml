packages:
  - "apps/*"
  - "packages/*"

fetchTimeout: 1200000
fetchRetries: 10
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 300000

allowBuilds:
  esbuild: true
  workerd: true
  # Postinstall only runs a version check (pulled in by Para's wallet connectors).
  "@reown/appkit": false

# Point the SDK at the sibling web-sdk checkout instead of the registry. `link:`
# symlinks the package directories, so a rebuild there (`pnpm build` in web-sdk)
# is picked up without reinstalling here. Paths are relative to this workspace
# root.
# "@miden-sdk/miden-sdk": "link:../web-sdk/crates/web-client"
# "@miden-sdk/react": "link:../web-sdk/packages/react-sdk"
# @miden-sdk/vite-plugin is installed in apps/web only for the vite-wasm-setup
# skill it ships (not registered in vite.config.ts) and peers on Vite <= 6.
peerDependencyRules:
  allowedVersions:
    "@miden-sdk/vite-plugin>vite": "8"

overrides:
  "@miden-sdk/miden-sdk": "0.17.10"
  "@miden-sdk/react": "0.17.10"
  # Security fixes for transitive dependencies (Dependabot alerts). Remove each
  # once the packages that pull it in (Para, monaco-editor, the node polyfills)
  # ship the patched version.
  "node-forge": "^1.4.2"
  "dompurify": "^3.4.17"
  "follow-redirects": "^1.16.2"
  "qs": "^6.16.1"
  "bn.js@4": "^4.12.3"
  # GHSA-g3hv-75wg-m249. Keep these two together: glob 11 silently matches nothing
  # on minimatch 11. Remove both once the SDK and shadcn's ts-morph move on.
  "minimatch": "^11.0.4"
  "glob": "^14.0.3"
# Para 3.27.0 (released 2026-11-09) drops the fetch instrumentation that broke
# Miden gRPC-web calls in 3.26. Remove these once 3.27.0 is past the minimum
# release age.
minimumReleaseAgeExclude:
  - "@getpara/core-sdk@3.27.0"
  - "@getpara/evm-wallet-connectors@3.27.0"
  - "@getpara/react-common@3.27.0"
  - "@getpara/react-component-library@3.27.0"
  - "@getpara/react-core@3.27.0"
  - "@getpara/react-sdk-lite@3.27.0"
  - "@getpara/user-management-client@3.27.0"
  - "@getpara/viem-v2-integration@3.27.0"
  - "@getpara/wagmi-v2-connector@3.27.0"
  - "@getpara/web-sdk@3.27.0"
  # Miden SDK 0.17.10 (released 2026-11-12). Remove these once it is past the
  # minimum release age.
  - "@miden-sdk/miden-sdk@0.17.10"
  - "@miden-sdk/miden-wallet-adapter-base@0.17.10"
  - "@miden-sdk/miden-wallet-adapter-miden@0.17.10"
  - "@miden-sdk/miden-wallet-adapter-react@0.17.10"
  - "@miden-sdk/miden-wallet-adapter-reactui@0.17.10"
  - "@miden-sdk/miden-wallet-adapter@0.17.10"
  - "@miden-sdk/node-darwin-arm64@0.17.10"
  - "@miden-sdk/node-darwin-x64@0.17.10"
  - "@miden-sdk/node-linux-x64-gnu@0.17.10"
  - "@miden-sdk/node-linux-x64-musl@0.17.10"
  - "@miden-sdk/para-react@0.17.10"
  - "@miden-sdk/para@0.17.10"
  - "@miden-sdk/react@0.17.10"
