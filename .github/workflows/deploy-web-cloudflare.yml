name: Deploy web to Cloudflare

on:
  push:
    branches: [main]
    # Deploy only when this service or a shared dependency/workspace manifest
    # changes — unrelated changes don't redeploy.
    paths:
      - "apps/web/**"
      # Playwright specs don't ship.
      - "!apps/web/e2e/**"
      - "packages/ui/**"
      - "packages/typescript-config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-web-cloudflare.yml"
  workflow_dispatch:

# The job only checks out the repository: the deploy uses the Cloudflare token.
permissions:
  contents: read

# Never run two deploys of this service at once; queue rather than cancel so an
# in-flight deploy is not interrupted.
concurrency:
  group: deploy-web-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the deploy: nothing reaches production from a commit that fails
      # them. Lint and typecheck cover the whole repository.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm --filter miden-playground-web test

      # Builds with Vite (`vite build` reads the build variables from
      # apps/web/.env.production) and deploys the Worker and its assets.
      # `pnpm run`, not `pnpm deploy`, which is a pnpm command of its own.
      - name: Deploy web to Cloudflare
        working-directory: apps/web
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
