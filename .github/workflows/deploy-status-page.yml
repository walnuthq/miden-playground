name: Deploy status page

# Owns the whole GitHub Pages site for this repository. A repository has exactly
# one Pages deployment and `deploy-pages` replaces the entire site on every run,
# so this must stay the only workflow that publishes Pages — a second one would
# delete this one's files on each of its runs.

on:
  push:
    branches:
      - main
    paths:
      - "apps/status-page/**"
      - "packages/ui/**"
      - ".github/workflows/deploy-status-page.yml"
  # Refreshes the status snapshot every 30 minutes, at :07 and :37. GitHub delays
  # or drops scheduled runs under load, worst at the top and bottom of the hour,
  # so the minutes are deliberately off-peak; on "0,30" runs landed hours apart.
  # Off-peak improves the odds but guarantees nothing. The floor is
  # api-compile's `/`, which proxies into a Cloudflare Container configured with
  # `sleepAfter: "5m"`: probing more often than that would keep the container
  # awake around the clock and bill for it. 30m stays well clear of that, so the
  # container still sleeps between probes. Read apps/status-page/README.md before
  # shortening this further.
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let a newer run supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('./apps/status-page/package.json').devDependencies.playwright")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Playwright is deliberately absent from `allowBuilds` in
      # pnpm-workspace.yaml, so `pnpm install` never downloads a browser. The
      # probe needs exactly one, installed here.
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter status-page exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter status-page exec playwright install-deps chromium

      - name: Build status page
        # Probes both services from the runner, then builds. A service being
        # down produces a red card, not a failed build.
        run: pnpm --filter status-page build
        env:
          # Production values of the services probed (local overrides go in
          # apps/status-page/.env.local, see .env.example).
          WEB_URL: https://playground.miden.xyz
          API_URL: https://miden-playground-api.walnut.dev
          # The probe reads the previously published snapshot from here to work
          # out what changed since the last run. Derived from the repository
          # when unset, so a fork reads its own state.
          STATUS_PAGE_URL: ${{ vars.STATUS_PAGE_URL }}

      - name: Notify Slack
        # Reads the snapshot the build just wrote and posts only when a
        # service's health changed, plus a reminder every 6h while it is still
        # down. Writes nothing, so it is safe after the build. Without the
        # secret it logs and exits 0 — forks stay silent.
        run: pnpm --filter status-page notify
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS_PAGE_URL: ${{ vars.STATUS_PAGE_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/status-page/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
