name: Drift checks

# A generated file follows something outside this repository: the MASM
# vocabulary (the assembler's sources, at the version pinned in
# apps/web/scripts/sync-masm-vocabulary.ts). The check can't be required on
# pull requests: it depends on GitHub's raw files being up.
on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/lib/masm/**"
      - "apps/web/scripts/sync-masm-vocabulary.ts"
      - ".github/workflows/drift.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: MASM vocabulary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: MASM vocabulary
        run: pnpm --filter miden-playground-web masm:check
