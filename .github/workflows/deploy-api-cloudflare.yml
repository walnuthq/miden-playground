name: Deploy api to Cloudflare

on:
  push:
    branches: [main]
    # Deploy only when this service or a shared dependency/workspace manifest
    # changes — unrelated changes don't redeploy.
    paths:
      - "apps/api/**"
      - "packages/typescript-config/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-api-cloudflare.yml"
  workflow_dispatch:

# The job only checks out the repository: the deploy uses the Cloudflare token.
permissions:
  contents: read

# Never run two deploys of this service at once; queue rather than cancel so an
# in-flight deploy is not interrupted.
concurrency:
  group: deploy-api-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Deploys `env.production` of apps/api/wrangler.jsonc (vars, Hyperdrive
      # binding and custom domain).
      # `pnpm run`, not `pnpm deploy`, which is a pnpm command of its own.
      - name: Deploy api to Cloudflare
        working-directory: apps/api
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
